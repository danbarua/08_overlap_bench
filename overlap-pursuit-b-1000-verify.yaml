name: overlap-pursuit-b-1000-verify


accelerator:
  prefer: [A100]
  accept_cpu: false

code:
  kind: bundle
  root: ./bundle
  entry: run_repo_script.py
  args:
    - scripts/run_pursuit_b.py
    - --device
    - cuda
    - --steps
    - "1000"
    - --out
    - outputs/pursuit-b-1000-verify.json
    - --save-model
    - outputs/ckpt-1000-verify.pt

deps:
  - numpy==1.24.3
  - scipy==1.11.4
  - scikit-learn==1.3.2
  - torch==2.8.0
  - torchvision==0.19.0

