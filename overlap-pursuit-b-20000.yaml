name: overlap-pursuit-b-20000


accelerator:
  prefer: [A100]
  accept_cpu: false

code:
  kind: bundle
  root: ./bundle
  entry: run_repo_script.py
  args:
    - scripts/run_pursuit_b.py
    - --device
    - cuda
    - --steps
    - "20000"
    - --out
    - outputs/pursuit-b-20000.json
    - --save-model
    - outputs/ckpt-20000.pt

deps:
  - numpy==2.1.2
  - scipy==1.14.1
  - scikit-learn==1.5.2
  - torch==2.8.0
  - torchvision==0.23.0

data:
