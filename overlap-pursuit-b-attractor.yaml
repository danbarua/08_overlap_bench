name: overlap-pursuit-b-attractor

accelerator:
  prefer: [A100]
  accept_cpu: false

code:
  kind: bundle
  root: ./bundle
  entry: run_repo_script.py
  args:
    - scripts/characterize_learned_attractor.py
    - --checkpoint
    - outputs/ckpt-10000.pt
    - --device
    - cuda
    - --out
    - outputs/attractor-10000.json

deps:
  - numpy==2.1.2
  - scipy==1.14.1
  - scikit-learn==1.5.2
  - torch==2.8.0
  - torchvision==0.23.0

data:
